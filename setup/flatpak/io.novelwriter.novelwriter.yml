app-id: io.novelwriter.novelwriter
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.11"
cleanup-commands:
  - /app/cleanup-BaseApp.sh
command: novelwriter
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Wayland access
  - --socket=wayland
  # Needs to talk to the network
  - --share=network
  # Needs to save files locally
  - --filesystem=host
  # OpenGL rendering
  - --device=dri
modules:
  - pypi-deps.json
  - name: enchant
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/rrthomas/enchant/releases/download/v2.8.19/enchant-2.8.19.tar.gz
        sha256: c8d70991d544ee39274b96bd01d2858a009fe732ff43f2aaf605fd61ecd06f60
  - name: novelWriter
    buildsystem: simple
    build-commands:
      - python3 -m build --wheel --no-isolation
      - python3 -m installer --prefix=${FLATPAK_DEST} dist/*.whl
      - install -Dm644 setup/data/novelwriter.desktop -T ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/Icon=novelwriter/Icon=${FLATPAK_ID}/" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
        install -Dm644 -T setup/data/hicolor/$size/apps/novelwriter.png ${FLATPAK_DEST}/share/icons/hicolor/$size/apps/${FLATPAK_ID}.png;
        install -Dm644 -T setup/data/hicolor/$size/mimetypes/application-x-novelwriter-project.png ${FLATPAK_DEST}/share/icons/hicolor/$size/mimetypes/application-x-novelwriter-project.png;
        done
      - install -Dm644 -T setup/data/hicolor/scalable/apps/novelwriter.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg;
      - install -Dm644 -T setup/data/hicolor/scalable/mimetypes/application-x-novelwriter-project.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/mimetypes/application-x-novelwriter-project.svg;
      - install -Dm644 -T novelwriter.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - sed -i "s/novelwriter.desktop/${FLATPAK_ID}.desktop/" ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: ../../pyproject.toml

      - type: file
        path: ../../LICENSE.md

      - type: dir
        path: ../../novelwriter
        dest: novelwriter

      - type: file
        path: ../../setup/description_pypi.md
        dest: setup

      - type: file
        path: ../../setup/LICENSE-Apache-2.0.txt
        dest: setup

      - type: dir
        path: ../../setup/data
        dest: setup/data

      # Generated by pkgutils.py
      - type: file
        path: ../../dist_flatpak/novelwriter.appdata.xml
